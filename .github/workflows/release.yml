# The only pipeline: push a `vX.Y.Z` tag and it
#   1. builds + pushes ghcr.io/<repo>:vX.Y.Z and :latest
#   2. builds the APK with versionName/versionCode derived from the tag and
#      publishes a GitHub Release with chattoneko-X.Y.Z.apk attached.
# The two jobs run in parallel; the release is published by `apk`, so a Docker
# failure does not swallow the APK.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # create the GitHub Release
  packages: write # push to ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json

      # mobile/scripts/sync.mjs runs `npm run build` in web/, so the web
      # dependencies must be installed first.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # mobile/scripts/icons.mjs renders the launcher icons with rsvg-convert.
      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # Same shared debug keystore as before, so CI APKs stay update-installable
      # over each other. `base64 -w0 ~/.android/debug.keystore` -> DEBUG_KEYSTORE.
      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "persistent debug keystore restored"
          else
            echo "::warning::DEBUG_KEYSTORE secret not set — using an ephemeral auto-generated keystore"
          fi

      - name: Build APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          IFS=. read -r maj min pat <<<"$v"
          # ponytail: X*10000+Y*100+Z — collides if minor or patch ever hit 100.
          make mobile-apk GRADLE_FLAGS="-PversionName=$v -PversionCode=$((maj * 10000 + min * 100 + pat))"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "chattoneko-$v.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "chattoneko-${TAG#v}.apk" --title "$TAG" --generate-notes
